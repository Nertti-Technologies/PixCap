[workspace]
members = [
    "crates/pixcap-core",
    "crates/pixcap-ipc",
    "crates/pixcap-ffi",
    "crates/pixcap-cli",
]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2021"
authors = ["PixCap Team"]
license = "Apache-2.0"

# Owner rule: no unwrap/expect outside tests. clippy.toml allows them in tests.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
